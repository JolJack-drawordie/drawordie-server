# 서버 이름
spring.application.name=drawordie

# ==========================================
# 배포할 때는 아래 ${이름:기본값}의 "이름"을 환경 변수로 넣는다 (Render 대시보드 > Environment).
# 환경 변수가 없으면 콜론 뒤의 기본값을 쓰므로, 내 컴퓨터에서는 지금처럼 설정 없이 실행된다.
# ==========================================

# 서버 포트 (Render는 PORT 환경 변수로 포트를 알려 줌, 로컬은 8080 → Unity ApiConfig 주소와 맞출 것)
server.port=${PORT:8080}

# ==========================================
# MySQL 데이터베이스 연결
# ==========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 로컬 기본값: 한국 시간 기준, 한글이 깨지지 않도록 UTF-8
# 배포(Aiven): jdbc:mysql://<호스트>:<포트>/defaultdb?sslMode=REQUIRED&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/drawordie?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:qkdwnsgk}

# ==========================================
# JPA / Hibernate
# ==========================================
# update: 서버가 켜질 때 엔티티에 맞춰 테이블 / 컬럼을 자동으로 추가 (기존 데이터는 유지, 컬럼 삭제는 안 함)
# → 새 DB에 처음 연결하면 테이블이 자동으로 만들어진다
spring.jpa.hibernate.ddl-auto=update

# MySQL용 SQL 문법 사용
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 실행되는 SQL을 콘솔에 보기 좋게 출력 (로컬 개발용, 배포 서버는 SHOW_SQL=false 권장)
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:true}

# ==========================================
# JWT 로그인 토큰
# ==========================================
# 토큰 서명 키 (Base64, 256비트 이상). 배포 서버에는 반드시 JWT_SECRET 환경 변수로 새 키를 넣을 것 (기본값은 로컬 개발용)
jwt.secret=${JWT_SECRET:SevfkJrYy3T2gb/KI1GjeBrDM+5y3GjREBzUssFloRJfltK0LiIt7ut6Qqqq0kWGn+vGdJFyFBxV4F9QxjDx5g==}
# 토큰 유효 시간 (밀리초, 24시간)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
