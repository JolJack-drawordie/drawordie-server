# 서버 이름
spring.application.name=drawordie

# 서버 포트 (Unity ApiConfig의 주소와 맞춰야 함)
server.port=8080

# ==========================================
# MySQL 데이터베이스 연결
# ==========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 한국 시간 기준, 한글이 깨지지 않도록 UTF-8
spring.datasource.url=jdbc:mysql://localhost:3306/drawordie?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=qkdwnsgk

# ==========================================
# JPA / Hibernate
# ==========================================
# update: 서버가 켜질 때 엔티티에 맞춰 테이블 / 컬럼을 자동으로 추가 (기존 데이터는 유지, 컬럼 삭제는 안 함)
spring.jpa.hibernate.ddl-auto=update

# MySQL용 SQL 문법 사용
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 실행되는 SQL을 콘솔에 보기 좋게 출력 (개발용)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT 로그인 토큰
# ==========================================
# 토큰 서명 키 (Base64, 256비트 이상). 실제 서버에서는 JWT_SECRET 환경 변수로 설정하고, 기본값은 로컬 개발용
jwt.secret=${JWT_SECRET:SevfkJrYy3T2gb/KI1GjeBrDM+5y3GjREBzUssFloRJfltK0LiIt7ut6Qqqq0kWGn+vGdJFyFBxV4F9QxjDx5g==}
# 토큰 유효 시간 (밀리초, 24시간)
jwt.expiration-ms=86400000
